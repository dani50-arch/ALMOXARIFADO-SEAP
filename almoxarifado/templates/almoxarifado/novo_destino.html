{% extends 'almoxarifado/base.html' %}

{% block titulo %}
Novo Destino
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    Cadastro de Destino
                </h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Salvar

                        </button>

                        <a
                            href="{% url 'home' %}"
                            class="btn btn-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
